# Każdy push i PR: typy, testy, build i audyt zależności. Czerwony CI = nie wdrażamy.
name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audyt zależności (błędy wysokie i krytyczne)
        run: npm audit --omit=dev --audit-level=high
