# Aplikacja na Androida (APK do testów) budowana w chmurze GitHuba: nie potrzebujesz Android Studio.
# Po każdej zmianie w kodzie: Actions → „Android APK” → plik do pobrania (Artifacts).
# Stałe linki (Releases):
#   - gałąź domyślna → „Regioorbit Android (test)”, plik regioorbit-test.apk (aplikacja „Regioorbit”),
#   - gałąź dev      → „Regioorbit Android (DEV)”, plik regioorbit-dev.apk (osobna aplikacja „Regioorbit DEV”,
#                      instaluje się obok testowej; tu sprawdzasz nowe rzeczy, zanim trafią dalej).
name: Android APK
on:
  push:
    paths-ignore: ['docs/**', '**/*.md', 'site/**', 'extension/**']
  workflow_dispatch:
permissions:
  contents: write
# Jeden przebieg naraz na gałąź: kolejny czeka w kolejce (nie przerywamy trwającego budowania).
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      # gałąź dev = wersja deweloperska (osobna aplikacja na telefonie)
      REGIOORBIT_DEV: ${{ github.ref_name == 'dev' && '1' || '0' }}
      VITE_CHANNEL: ${{ github.ref_name == 'dev' && 'dev' || 'test' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Aplikacja (web) do środka APK
        # Tryb na żywo, gdy w Settings → Secrets and variables → Actions → Variables są adres i klucz anon Supabase.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build && npx cap sync android
      - name: Budowanie APK (wersja testowa)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Nazwa pliku
        run: cp android/app/build/outputs/apk/debug/app-debug.apk regioorbit-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: regioorbit-android-${{ github.run_number }}
          path: regioorbit-test.apk
          retention-days: 30
      - name: Stały link do pobrania (gałąź domyślna)
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test regioorbit-test.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Regioorbit Android (test) #${{ github.run_number }}" \
            --notes "Wersja testowa z dnia $(date -u +%Y-%m-%d) (commit ${GITHUB_SHA::7}). Instalacja: docs/START.md."
      - name: Stały link do pobrania (gałąź dev)
        if: github.ref_name == 'dev'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp regioorbit-test.apk regioorbit-dev.apk
          gh release delete android-dev --yes --cleanup-tag || true
          gh release create android-dev regioorbit-dev.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Regioorbit Android (DEV) #${{ github.run_number }}" \
            --notes "Wersja deweloperska z gałęzi dev, $(date -u +%Y-%m-%d) (commit ${GITHUB_SHA::7}). Osobna aplikacja „Regioorbit DEV”. Instalacja: docs/START.md."

  # Emulator Androida w chmurze: instaluje APK, przechodzi rejestrację, stuka palcem i robi zrzuty ekranu.
  # Dwa telefony naraz: Android 14 i Android 16 (od Androida 15 aplikacja rysuje się pod paskami systemu,
  # jak na nowych Samsungach, więc to tam wychodzą błędy z zasłoniętymi przyciskami).
  # Zrzuty: Actions → przebieg → Artifacts „zrzuty-api34-…” / „zrzuty-api36-…”, z gałęzi domyślnej także w Releases → android-test.
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        api: [34, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: regioorbit-android-${{ github.run_number }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright do sterowania aplikacją (tylko biblioteka, bez przeglądarek)
        run: npm install --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
      - name: Przyspieszenie sprzętowe emulatora (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator (Pixel 6, Android API ${{ matrix.api }}) i test aplikacji
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          APP_PKG: ${{ github.ref_name == 'dev' && 'com.regioorbit.app.dev' || 'com.regioorbit.app' }}
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: node scripts/apk-smoke.cjs regioorbit-test.apk zrzuty
      - name: Nazwy zrzutów z wersją Androida
        if: always()
        run: for f in zrzuty/*; do [ -e "$f" ] && mv "$f" "zrzuty/api${{ matrix.api }}-$(basename "$f")"; done; true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty-api${{ matrix.api }}-${{ github.run_number }}
          path: zrzuty
          retention-days: 30
      - name: Zrzuty do wydania (gałąź domyślna albo dev)
        if: always() && (github.ref_name == github.event.repository.default_branch || github.ref_name == 'dev')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ github.ref_name == 'dev' && 'android-dev' || 'android-test' }}
        run: ls zrzuty/* >/dev/null 2>&1 && gh release upload "$RELEASE" zrzuty/* --clobber || echo "brak zrzutów"
