# Aplikacja na Androida (APK do testów) budowana w chmurze GitHuba: nie potrzebujesz Android Studio.
# Po każdej zmianie w kodzie: Actions → „Android APK” → plik do pobrania (Artifacts).
# Z gałęzi domyślnej dodatkowo stały link: Releases → „Miliorbit Android (test)” → miliorbit-test.apk.
name: Android APK
on:
  push:
    paths-ignore: ['docs/**', '**/*.md', 'site/**', 'extension/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - name: Aplikacja (web) do środka APK
        # Tryb na żywo, gdy w Settings → Secrets and variables → Actions → Variables są adres i klucz anon Supabase.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build && npx cap sync android
      - name: Budowanie APK (wersja testowa)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Nazwa pliku
        run: cp android/app/build/outputs/apk/debug/app-debug.apk miliorbit-test.apk
      - uses: actions/upload-artifact@v4
        with:
          name: miliorbit-android-${{ github.run_number }}
          path: miliorbit-test.apk
          retention-days: 30
      - name: Stały link do pobrania (tylko gałąź domyślna)
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test miliorbit-test.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Miliorbit Android (test) #${{ github.run_number }}" \
            --notes "Wersja testowa z dnia $(date -u +%Y-%m-%d) (commit ${GITHUB_SHA::7}). Dane przykładowe, zapis tylko na telefonie. Instalacja: docs/START.md."

  # Emulator Androida w chmurze: instaluje APK, przechodzi rejestrację i robi zrzuty ekranu.
  # Zrzuty: Actions → przebieg → Artifacts „zrzuty-emulator-…”, a z gałęzi domyślnej także w Releases → android-test.
  emulator:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: miliorbit-android-${{ github.run_number }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright do sterowania aplikacją (tylko biblioteka, bez przeglądarek)
        run: npm install --prefix "$RUNNER_TEMP/pw" playwright-core@1.56.1
      - name: Przyspieszenie sprzętowe emulatora (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator (Pixel 6, Android 14) i test aplikacji
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: node scripts/apk-smoke.cjs miliorbit-test.apk zrzuty
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zrzuty-emulator-${{ github.run_number }}
          path: zrzuty
          retention-days: 30
      - name: Zrzuty do wydania (gałąź domyślna)
        if: always() && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: ls zrzuty/* >/dev/null 2>&1 && gh release upload android-test zrzuty/* --clobber || echo "brak zrzutów"
