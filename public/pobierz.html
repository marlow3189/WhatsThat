<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pobierz Miliorbit</title>
    <meta name="description" content="Miliorbit: pożyczaj, wynajmuj i kupuj od znajomych i sąsiadów. Android, iPhone i przeglądarka." />
    <meta name="theme-color" content="#f1f2f4" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./pobierz.css" />
  </head>
  <body>
    <main>
      <img src="./icon.svg" alt="" width="72" height="72" />
      <h1>Miliorbit</h1>
      <p class="lead" data-pl="Twoja orbita: znajomi i sąsiedzi. Pożyczaj, wynajmuj i kupuj od ludzi obok." data-en="Your orbit: friends and neighbours. Borrow, rent and buy from people nearby.">Twoja orbita: znajomi i sąsiedzi. Pożyczaj, wynajmuj i kupuj od ludzi obok.</p>
      <p class="status" id="status" aria-live="polite"></p>
      <div class="buttons">
        <a id="android" class="btn" href="#">Google Play (Android)</a>
        <a id="ios" class="btn" href="#">App Store (iPhone)</a>
        <a id="web" class="btn ghost" href="./">Otwórz w przeglądarce</a>
      </div>
      <p class="hint" id="hint"></p>
    </main>
    <script src="./pobierz.js"></script>
  </body>
</html>
