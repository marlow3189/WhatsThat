  <body>
    <div id="root"></div>
    <!-- Bezpiecznik startu: gdyby aplikacja nie wystartowała w 10 s (zamiast białego ekranu), komunikat i przycisk. -->
    <script>(function(){var errs=[];addEventListener('error',function(e){errs.push(String(e.message||e.error||'?'))});addEventListener('unhandledrejection',function(e){errs.push(String(e.reason&&e.reason.message||e.reason))});setTimeout(function(){var r=document.getElementById('root');if(!r||r.childElementCount)return;var de=/^de/.test(navigator.language),pl=/^pl/.test(navigator.language);var t=pl?['Aplikacja się nie uruchomiła','Uruchom ponownie']:de?['Die App ist nicht gestartet','Neu starten']:['The app did not start','Restart'];r.innerHTML='<div style="font:16px system-ui,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 48px) 24px 24px;color:#2d2620"><p style="font-size:20px;font-weight:700;margin:0 0 12px">'+t[0]+'</p><button id="boot-reload" style="font:inherit;font-weight:700;color:#2d1608;background:#e88958;border:0;border-radius:999px;padding:12px 24px">'+t[1]+'</button><pre style="white-space:pre-wrap;font-size:11px;color:#6e645a;margin-top:16px"></pre></div>';r.querySelector('pre').textContent=navigator.userAgent+'\n'+errs.join('\n');document.getElementById('boot-reload').onclick=function(){location.reload()}},10000)})();</script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
