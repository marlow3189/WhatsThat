<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Miliorbit</title>
    <meta name="description" content="Otwórz w aplikacji Miliorbit albo w przeglądarce." />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f1f2f4" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/site.css" />
  </head>
  <body data-open>
    <main class="center">
      <div class="box">
        <img class="logo" src="/icon.svg" alt="" width="72" height="72" />
        <h1 id="title" data-en="Open in Miliorbit">Otwórz w Miliorbit</h1>
        <p class="lead" id="lead" data-en="This link opens in the app. Don’t have it yet? Install it or view it in the browser.">Ten link otwiera się w aplikacji. Nie masz jej jeszcze? Zainstaluj albo zobacz w przeglądarce.</p>
        <div class="stores">
          <a class="store" data-store="android" href="#" rel="noopener">
            <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3.5v17a1 1 0 0 0 1.5.86l14-8.5a1 1 0 0 0 0-1.72l-14-8.5A1 1 0 0 0 5 3.5Z" /></svg>
            <span><small data-en="Get it on">Pobierz z</small><b>Google Play</b></span>
          </a>
          <a class="store" data-store="ios" href="#" rel="noopener">
            <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="2.5" width="12" height="19" rx="3" fill="none" stroke="currentColor" stroke-width="2" /><path d="M10.5 18.5h3" stroke="currentColor" stroke-width="2" stroke-linecap="round" /></svg>
            <span><small data-en="Download on the" data-soon="Wkrótce w" data-soon-en="Coming soon to the">Pobierz z</small><b>App Store</b></span>
          </a>
        </div>
        <a class="browser" id="browser" href="/app/" data-en="View in the browser →">Zobacz w przeglądarce →</a>
      </div>
    </main>
    <script src="/stores.js"></script>
    <script src="/site.js"></script>
  </body>
</html>
